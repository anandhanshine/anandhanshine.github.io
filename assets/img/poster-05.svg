<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-label="Project 05 — unreleased prototype">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#131a2c"/>
      <stop offset="55%" stop-color="#080a12"/>
      <stop offset="100%" stop-color="#04050a"/>
    </radialGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="55%" stop-color="#b79bff"/>
      <stop offset="100%" stop-color="#2ef0d6"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#ffffff" opacity=".035"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#bg)"/>
  <circle cx="450" cy="430" r="330" fill="#2ef0d6" opacity=".10" filter="url(#soft)"/>
  <circle cx="450" cy="460" r="240" fill="#b79bff" opacity=".08" filter="url(#soft)"/>

  <g fill="none">
    <circle cx="450" cy="450" r="92" stroke="#b79bff" stroke-width="5" opacity=".18"/>
    <circle cx="450" cy="450" r="132" stroke="#2ef0d6" stroke-width="4" opacity=".16"/>
    <circle cx="450" cy="450" r="172" stroke="#b79bff" stroke-width="4" opacity=".13"/>
    <circle cx="450" cy="450" r="196" stroke="#2ef0d6" stroke-width="3" opacity=".12"/>
    <circle cx="450" cy="450" r="215" stroke="#b79bff" stroke-width="3" stroke-dasharray="12 16" stroke-dashoffset="24" opacity=".55"/>
  </g>

  <text x="450" y="565" text-anchor="middle" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="300" letter-spacing="8" fill="url(#num)">05</text>

  <text x="450" y="214" text-anchor="middle" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="25" letter-spacing="9" fill="#b79bff" opacity=".95">UNRELEASED PROTOTYPE</text>
  <text x="450" y="716" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="21" letter-spacing="5" fill="#c9d3e6" opacity=".8">CAPTURE PENDING</text>
  <text x="450" y="758" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" letter-spacing="4" fill="#2ef0d6" opacity=".7">WORK IN PROGRESS</text>

  <rect width="900" height="900" fill="url(#scan)"/>
  <circle cx="450" cy="450" r="446" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>

  <g stroke="#2ef0d6" stroke-width="3" opacity=".7">
    <line x1="250" y1="152" x2="380" y2="152"/>
    <line x1="520" y1="152" x2="650" y2="152"/>
    <line x1="250" y1="812" x2="650" y2="812" opacity=".5"/>
  </g>
  <g fill="#b79bff">
    <rect x="238" y="144" width="8" height="8"/>
    <rect x="654" y="144" width="8" height="8"/>
  </g>
</svg>